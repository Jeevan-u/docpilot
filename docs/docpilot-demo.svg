<g font-family="Arial" font-size="20" fill="white">
<rect x="45" y="105" width="230" height="90" rx="14" fill="#1f2937"/><text x="70" y="145">Documents</text><text x="70" y="175" fill="#9ca3af">PDF / Markdown / TXT</text>
<text x="300" y="160" font-size="32">→</text>
<rect x="345" y="105" width="230" height="90" rx="14" fill="#1f2937"/><text x="370" y="145">Semantic retrieval</text><text x="370" y="175" fill="#9ca3af">top-k passages</text>
<text x="600" y="160" font-size="32">→</text>
